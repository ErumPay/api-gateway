# API Gateway 애플리케이션 설정 파일 (YAML 형식)

# 게이트웨이 포트
server:
  port: 8080

# Spring Boot 설정
spring:
  # 애플리케이션 설정
  application:
    name: api-gateway

  # Spring Cloud Gateway 설정
  cloud:
    gateway:
      server:
        webflux:
          # 전역 CORS(보안) 설정
          globalcors:
            cors-configurations:
              '[/**]':                                # 이하 모든 경로에 대해 허용
                allowed-origins:
                  - 'http://localhost:3000'           # 예전 프론트 (예시, 추후 제거 가능)
                  - 'http://localhost:5173'           # web-client (Vite 기본 포트)
                  - 'http://localhost:19006'          # Expo Web 기본 포트
                  # NOTE: Expo Go(모바일)는 native fetch라 CORS 영향 없음
                  #       Expo dev tunnel/lan을 쓸 경우 실제 origin 추가 필요
                allowed-methods: '*'                  # 모든 HTTP 메서드 허용
                allowed-headers: '*'                  # 모든 헤더 허용
                exposed-headers: '*'                  # 클라이언트에게 모든 헤더 노출 허용
                allow-credentials: true               # 자격 증명 포함 요청 허용 (쿠키, 인증 정보 등)

          # ──────────────────────────────────────────────────────────────
          # 라우팅 정책
          #  - 외부 호출 경로  : /{service-name}/**           (예: /auth-service/api/auth/kakao/login)
          #  - 내부 컨트롤러   : StripPrefix=1 적용 후 실제 경로 (예: /api/auth/kakao/login)
          #  - 미구현 서비스는 추정 경로를 # NOTE: 로 표기, 실제 구현 시 확인/수정
          # ──────────────────────────────────────────────────────────────
          routes:
            # ============== Backend Services ==============

            # auth-service 라우팅 (8081)
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth-service/**
              filters:
                - StripPrefix=1

            # card-service 라우팅 (8082)
            - id: card-service
              uri: ${CARD_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/card-service/**
              filters:
                - StripPrefix=1

            # payment-service 라우팅 (8083)
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/payment-service/**
              filters:
                - StripPrefix=1

            # recommendation-service 라우팅 (8084)
            - id: recommendation-service
              uri: ${RECOMMENDATION_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/recommendation-service/**
              filters:
                - StripPrefix=1

            # notification-service 라우팅 (8085)
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/notification-service/**
              filters:
                - StripPrefix=1

            # ============== PG (Payment Gateway) Services ==============

            # pg-auth-service 라우팅 (8091)
            - id: pg-auth-service
              uri: ${PG_AUTH_SERVICE_URI:http://localhost:8091}
              predicates:
                - Path=/pg-auth-service/**
              filters:
                - StripPrefix=1

            # billing-key-service 라우팅 (8092)
            - id: billing-key-service
              uri: ${BILLING_KEY_SERVICE_URI:http://localhost:8092}
              predicates:
                - Path=/billing-key-service/**
              filters:
                - StripPrefix=1

            # pg-payment-service 라우팅 (8093)
            - id: pg-payment-service
              uri: ${PG_PAYMENT_SERVICE_URI:http://localhost:8093}
              predicates:
                - Path=/pg-payment-service/**
              filters:
                - StripPrefix=1

            # merchant-service 라우팅 (8094)
            - id: merchant-service
              uri: ${MERCHANT_SERVICE_URI:http://localhost:8094}
              predicates:
                - Path=/merchant-service/**
              filters:
                - StripPrefix=1

            # card-simulator-service 라우팅 (8095)
            - id: card-simulator-service
              uri: ${CARD_SIMULATOR_SERVICE_URI:http://localhost:8095}
              predicates:
                - Path=/card-simulator-service/**
              filters:
                - StripPrefix=1

# 헬스체크 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT 설정
jwt:
  secret: ${JWT_SECRET:erumpay-auth-service-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}